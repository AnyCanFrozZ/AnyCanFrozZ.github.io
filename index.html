<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyCanFrozZ — Персональный сайт</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --accent: #6c63ff;
            --accent-hover: #8b85ff;
            --text: #e0e0e0;
            --text-muted: #a0a0b8;
            --border: #2a2a40;
            --radius: 16px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 50%, rgba(108, 99, 255, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 50%, rgba(108, 99, 255, 0.08) 0%, transparent 50%);
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Карточка профиля */
        .profile-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .profile-card:hover {
            border-color: var(--accent);
            box-shadow: 0 25px 70px rgba(108, 99, 255, 0.15);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #4a3fbf);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -1px;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .username {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .username .highlight {
            color: var(--accent);
        }

        .title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Социальные кнопки */
        .social-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }

        .social-btn:hover {
            background: rgba(108, 99, 255, 0.1);
            border-color: var(--accent);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.2);
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Разделитель */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Навыки */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: var(--transition);
            cursor: default;
        }

        .skill-tag:hover {
            background: rgba(108, 99, 255, 0.15);
            border-color: var(--accent);
            color: #ffffff;
        }

        /* Футер */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .profile-card {
                padding: 30px 20px;
            }

            .avatar {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .username {
                font-size: 1.4rem;
            }

            .social-links {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
